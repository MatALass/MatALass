name: Build profile assets

# Tests the generator, builds every image the README points to (header, project
# cards, languages) and publishes them to the "output" branch.

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch: # manual run from the Actions tab
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "assets/**"
      - "profile.config.json"
      - "pyproject.toml"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          pip install pytest
          pytest

      - name: Generate assets
        env:
          # Optional: a PROFILE_TOKEN secret (classic PAT, read:user scope)
          # also counts private contributions. Falls back to the built-in token.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: python -m profile_assets --config profile.config.json --out dist

      - name: Publish to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
